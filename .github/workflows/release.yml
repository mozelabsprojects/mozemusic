name: Build & Release MozeMusic

on:
  push:
    tags:
      - 'v*' # v1.0.1, v1.1.0 vb. bir tag pushlandığında otomatik çalışır
  workflow_dispatch: # GitHub web arayüzünden tek tıkla manuel tetikleme imkanı

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk MozeMusic-Android.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mozemusic-android
          path: MozeMusic-Android.apk

  build-windows:
    name: Build Windows Release
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Build Windows Installers
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath installer_src\payload.zip -Force
          $csc = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /target:winexe /optimize+ /reference:System.IO.Compression.FileSystem.dll /reference:System.IO.Compression.dll /win32icon:windows\runner\resources\app_icon.ico /resource:installer_src\payload.zip,MozeMusicPayload /out:MozeMusic_Kurulum_Sihirbazi.exe installer_src\Program.cs
          & $csc /target:winexe /optimize+ /define:LANG_EN /reference:System.IO.Compression.FileSystem.dll /reference:System.IO.Compression.dll /win32icon:windows\runner\resources\app_icon.ico /resource:installer_src\payload.zip,MozeMusicPayload /out:MozeMusic_Setup.exe installer_src\Program.cs
          Remove-Item installer_src\payload.zip -Force

      - name: Upload Windows Installers Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mozemusic-windows-installers
          path: |
            MozeMusic_Kurulum_Sihirbazi.exe
            MozeMusic_Setup.exe

  create-release:
    name: Publish GitHub Release
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: mozemusic-android

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: mozemusic-windows-installers

      - name: Create Release & Upload Assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            MozeMusic-Android.apk
            MozeMusic_Kurulum_Sihirbazi.exe
            MozeMusic_Setup.exe
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
